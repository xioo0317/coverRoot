name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 后端编译：local_api（host 冒烟回归 + Android arm64 交叉编译） ----------
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Build local_api (host) + smoke test (file socket)
        run: |
          cmake -S local-api -B local-api/build -DCMAKE_BUILD_TYPE=Release
          cmake --build local-api/build -j$(nproc)
          (LOCAL_API_ALLOW_ALL=1 ./local-api/build/local_api router /tmp/local_api.sock > /tmp/api.log 2>&1 &)
          sleep 2
          bash local-api/test_api.sh
          pkill -x local_api || true

      # The abstract namespace is the production path on Android; keep it tested
      # (a byte-level name mismatch between C bind and Java LocalSocket is silent).
      - name: Smoke test (abstract socket)
        run: |
          (LOCAL_API_ALLOW_ALL=1 ./local-api/build/local_api router @local_api-test > /tmp/api-abs.log 2>&1 &)
          sleep 2
          LOCAL_API_SOCK=@local_api-test bash local-api/test_api.sh
          pkill -x local_api || true

      - name: Build local_api (android arm64)
        run: |
          cmake -S local-api -B local-api/build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build local-api/build-android -j$(nproc)
          file local-api/build-android/local_api | grep -q aarch64 && echo "✓ local_api (arm64) built as standalone executable" || (echo "✗ not arm64"; exit 1)

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-local_api
          path: local-api/build-android/local_api
          retention-days: 1

  # ---------- 前端编译：manager APK（debug + release） ----------
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: manager
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload frontend APKs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-apks
          path: manager/app/build/outputs/apk/*/*.apk
          retention-days: 1

  # ---------- 汇总：前端 + 后端合并成一个压缩包 ----------
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, frontend]
    steps:
      - name: Checkout (install scripts)
        uses: actions/checkout@v4

      - name: Download backend & frontend artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble bundle
        run: |
          set -e
          STAGE=bundle/coverRoot-build-${{ github.run_number }}
          mkdir -p "$STAGE"
          cp dist/backend-local_api/local_api "$STAGE/local_api"
          chmod +x "$STAGE/local_api"
          cp local-api/scripts/install.sh   "$STAGE/install.sh"
          cp local-api/scripts/uninstall.sh "$STAGE/uninstall.sh"
          chmod +x "$STAGE/install.sh" "$STAGE/uninstall.sh"
          find dist/frontend-apks -name '*debug*.apk'  -exec cp {} "$STAGE/coverRoot-debug.apk" \;
          find dist/frontend-apks -name '*release*.apk' -exec cp {} "$STAGE/coverRoot-release-unsigned.apk" \;
          cat > "$STAGE/README.txt" <<EOF
          coverRoot build #${{ github.run_number }}
          commit: ${{ github.sha }}

          Contents:
            local_api                       daemon binary (Android arm64, UDS + ECDSA handshake)
            install.sh                      one-shot installer (installs + starts + boot autostart)
            uninstall.sh                    uninstaller (daemon + autostart module)
            coverRoot-debug.apk             manager app (debug)
            coverRoot-release-unsigned.apk  manager app (release, unsigned)

          Deploy (recommended, one command):
            1. Push the whole bundle folder to the device, e.g. /data/local/tmp/coverRoot
            2. Run:  su -c 'sh /data/local/tmp/coverRoot/install.sh'
               - installs the daemon to /data/adb/local_api and starts it
               - installs a boot autostart module (Magisk / KernelSU / APatch compatible)
               - prints environment diagnostics (SELinux mode, policy tools)
            3. Install the manager APK and open the app.

          Uninstall:
            su -c 'sh /data/adb/local_api/uninstall.sh'

          Manual deploy (no script):
            cp local_api /data/adb/local_api/ && chmod 755 /data/adb/local_api/local_api
            su -c '/data/adb/local_api/local_api router @local_api'
            The daemon applies the required SELinux rules on start (root required).
          EOF
          ls -la "$STAGE"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: coverRoot-bundle-${{ github.run_number }}
          path: bundle
          retention-days: 30
