name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Build local_api (host) + smoke test
        run: |
          cmake -S local-api -B local-api/build -DCMAKE_BUILD_TYPE=Release
          cmake --build local-api/build -j$(nproc)
          (./local-api/build/local_api router > /tmp/api.log 2>&1 &)
          sleep 2
          bash local-api/test_api.sh 127.0.0.1 8080
          pkill -x local_api || true

      - name: Build local_api (android arm64)
        run: |
          cmake -S local-api -B local-api/build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build local-api/build-android -j$(nproc)
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp local-api/build-android/local_api manager/app/src/main/jniLibs/arm64-v8a/liblocal_api.so
          file manager/app/src/main/jniLibs/arm64-v8a/liblocal_api.so | grep -q aarch64 && echo "✓ liblocal_api.so (arm64) ready for APK" || (echo "✗ not arm64"; exit 1)

      - name: Build with Gradle
        working-directory: manager
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coverRoot-debug
          path: manager/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: coverRoot-release-unsigned
          path: manager/app/build/outputs/apk/release/*.apk
